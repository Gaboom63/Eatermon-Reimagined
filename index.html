<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eatermon Reimagined</title>
    <link rel="stylesheet" href="CSS Files/battleMenu.css">
    <link rel="stylesheet" href="CSS Files/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>

    <div id="battleMenu">
        <div id="playerContents"> <!-- This div exists for easy ability to collapse all player values.-->
            <div id="playerHPContiner">
                <b>
                    <p id="playerName">Name</p>
                    <p id="playerXP">Level. 1</p>
                </b>
                <div id="playerHPBar"></div>
            </div>
            <p id="playerHP">100 / 100</p>
            <div id="playerImageContainer">
                <img id="playerEatermonImg" src="Images/Eatermons/Ban Blast.png">
            </div>
            <div id="textbox"></div>
            <div id="attackContainer">
                <div id="attackMenu" onclick="showMenu('attack')">Attack</div>
                <div id="attackMenu" onclick="showMenu('bag')">Bag</div>
                <div id="attackMenu" onclick="showMenu('eatermon')">Eatermon</div>
                <div id="attackMenu" onclick="showMenu('run')">Run</div>
            </div>
            <div id="attackSubContainers">
                <span style="font-size: 50px; position: absolute; left: 5%; bottom: 80%;" onclick="back()">&larr;</span>
                <div id="subMenuText"></div>
                <div id="eatermoinMenuContainer">
                    <div class="eatermons" id="eatermon1" onclick="swapEatermon('eatermon1')"></div>
                    <div class="eatermons" id="eatermon2" onclick="swapEatermon('eatermon2')"></div>
                    <div class="eatermons" id="eatermon3" onclick="swapEatermon('eatermon3')"></div>
                    <div class="eatermons" id="eatermon4" onclick="swapEatermon('eatermon4')"></div>
                    <div class="eatermons" id="eatermon5" onclick="swapEatermon('eatermon5')"></div>
                    <div class="eatermons" id="eatermon6" onclick="swapEatermon('eatermon6')"></div>
                </div>
            </div>
        </div>
        <div id="enemyContents">
            <div id="enemyHpContainer">
                <b>
                    <p id="enemyName">Name</p>
                    <p id="enemyXP">Level. 1</p>
                </b>
                <div id="enemyHPBar"></div>
            </div>
            <p id="enemyHP">100 / 100</p>
            <div id="enemyImageContainer">
                <img id="enemyEatermonImg" src="Images/Eatermons/Allahdoodle.png">
            </div>
        </div>
    </div>
    <div id="textContainer">
        <div id="imageBox">
            <img id="talkingImg">
        </div>
        <div id="mainTalkingBox">You Are Talking!</div>
    </div>
    <canvas id="gameCanvas" width="1024" height="480">
    </canvas>
    <div id="fadeScreen"></div>

    <script src="JS Files/eatermons.js"></script>
    <script src="JS Files/maps.js"></script>
    <script src="JS Files/mapLogic.js"></script>
    <script src="JS Files/handleInputs.js"></script>
    <script src="JS Files/npc.js"></script>
    <script src="JS Files/battle.js"></script>
    <script src="JS Files/game.js"></script>
</body>

</html>
